[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pine-v6-copilot"
version = "0.1.0"
description = "Pine Script v6 assistant with an offline checker, retrieval, bounded repair and a measured evaluation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "psycopg[binary]==3.3.8",
    "pynescript==0.3.0",
    "openai==3.49.0",
    "google-genai==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools]
packages = ["api", "checker", "eval", "ingest", "llm", "pipeline", "retrieval"]
py-modules = ["config"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
